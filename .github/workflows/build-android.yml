name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore Sonic4Android.csproj

      - name: Build APK
        run: dotnet build Sonic4Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk

      - name: Collect APK
        run: |
          mkdir -p artifacts
          SIGNED=$(find bin -name '*-Signed.apk' | head -n 1)
          test -n "$SIGNED"
          cp "$SIGNED" artifacts/sonic-4-ep-1.apk
          ls -la artifacts

      - name: Verificar APK (integridad y firma)
        run: |
          APK=artifacts/sonic-4-ep-1.apk
          ls -l "$APK"
          sha256sum "$APK"
          unzip -tq "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: sonic-4-ep-1-apk
          path: artifacts/sonic-4-ep-1.apk
          if-no-files-found: error

      - name: Publish release (APK descargable sin zip)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sonic 4 ep 1 build ${{ github.run_number }}
          files: artifacts/sonic-4-ep-1.apk
          fail_on_unmatched_files: true
