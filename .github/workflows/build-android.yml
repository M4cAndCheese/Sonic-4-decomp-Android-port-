name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore Sonic4Android.csproj

      # Clave automática persistente: se genera una vez y se reutiliza entre builds
      # (así las actualizaciones instalan sin desinstalar). Solo se usa si no hay secretos propios.
      - name: Restaurar clave automática
        uses: actions/cache@v4
        with:
          path: signing/auto.p12
          key: android-auto-signing-v1

      - name: Preparar clave de firma
        id: keys
        env:
          PEM: ${{ secrets.ANDROID_SIGNING_PEM }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$PEM" ] && [ -n "$KS_PASS" ]; then
            printf '%s\n' "$PEM" | tr -d '\r' > "$RUNNER_TEMP/bundle.pem"
            awk '/BEGIN PRIVATE KEY/,/END PRIVATE KEY/' "$RUNNER_TEMP/bundle.pem" > "$RUNNER_TEMP/key.pem"
            awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/' "$RUNNER_TEMP/bundle.pem" > "$RUNNER_TEMP/cert.pem"
            openssl pkcs12 -export \
              -inkey "$RUNNER_TEMP/key.pem" \
              -in "$RUNNER_TEMP/cert.pem" \
              -name sonic4 \
              -out "$RUNNER_TEMP/release.p12" \
              -passout env:KS_PASS
            echo "SIGN_KS=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SIGN_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "MODE=release (propia)" >> "$GITHUB_ENV"
          else
            AUTO_PASS="sonic4-auto-signing"
            if [ ! -f signing/auto.p12 ]; then
              mkdir -p signing
              keytool -genkeypair -keystore signing/auto.p12 -storetype PKCS12 \
                -alias sonic4 -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$AUTO_PASS" -keypass "$AUTO_PASS" -dname "CN=Sonic 4 ep 1"
            fi
            echo "SIGN_KS=$GITHUB_WORKSPACE/signing/auto.p12" >> "$GITHUB_ENV"
            echo "SIGN_PASS=$AUTO_PASS" >> "$GITHUB_ENV"
            echo "MODE=automatica (cacheada)" >> "$GITHUB_ENV"
          fi

      - name: Build APK firmado
        run: |
          dotnet build Sonic4Android.csproj -c Release -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$SIGN_KS" \
            -p:AndroidSigningStorePass="$SIGN_PASS" \
            -p:AndroidSigningKeyAlias=sonic4 \
            -p:AndroidSigningKeyPass="$SIGN_PASS"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          SIGNED=$(find bin -name '*-Signed.apk' | head -n 1)
          test -n "$SIGNED"
          cp "$SIGNED" artifacts/sonic-4-ep-1.apk
          ls -la artifacts

      - name: Verificar APK (integridad, alineación y firma)
        id: verify
        run: |
          APK=artifacts/sonic-4-ep-1.apk
          ls -l "$APK"
          unzip -tq "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          # Falla el build si el APK no tiene firma válida (v2 o superior)
          "$BT/apksigner" verify --min-sdk-version 24 --verbose --print-certs "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: sonic-4-ep-1-apk
          path: artifacts/sonic-4-ep-1.apk
          if-no-files-found: error

      - name: Publish release (APK descargable sin zip)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sonic 4 ep 1 build ${{ github.run_number }}
          body: |
            APK: sonic-4-ep-1.apk
            Firma: ${{ env.MODE }}
            Tamaño: ${{ steps.verify.outputs.size }} bytes
            SHA-256: ${{ steps.verify.outputs.sha }}
          files: artifacts/sonic-4-ep-1.apk
          fail_on_unmatched_files: true
